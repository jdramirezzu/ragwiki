<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragwiki intro</title>
<meta name="description" content="A two-minute intro to ragwiki: build vector search, a WikiLLM or another kind of RAG from your documents and let your questions decide.">
<style>
:root{--bg:#10121d;--card:#181b2b;--ink:#f3efe6;--mute:#9aa0b8;--gold:#f3d36b;--wiki:#8b85ff;--rag:#fb8a52;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 15% 0%,#1d2140 0,transparent 60%),var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
main{width:100%;max-width:1040px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:20px}
.mark{display:inline-flex;gap:4px}.mark i{width:10px;height:22px;border-radius:3px;display:block}
.mark .w{background:var(--wiki)}.mark .r{background:var(--rag)}
h1{font:600 clamp(24px,4vw,36px)/1.15 Georgia,serif;margin:18px 0 8px}
p{color:#cfcac0;margin:0 0 20px;max-width:70ch}
.tabs{display:inline-flex;border:1px solid #2b3050;border-radius:10px;overflow:hidden;margin-bottom:14px}
.tabs button{font:inherit;color:var(--ink);background:var(--card);border:0;padding:8px 18px;cursor:pointer}
.tabs button+button{border-left:1px solid #2b3050}
.tabs button[aria-pressed=true]{background:var(--gold);color:var(--bg);font-weight:650}
video{width:100%;border-radius:14px;background:#000;box-shadow:0 30px 70px -30px rgba(0,0,0,.8);display:block}
footer{margin-top:18px;color:var(--mute);font-size:14px}
a{color:var(--gold)}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"><i class="w"></i><i class="r"></i></span>ragwiki</div>
  <h1 id="title">Which kind of RAG fits your documents? See it in two minutes.</h1>
  <p id="lead">Build either one from your own documents, ask with it, or compare both with the same model and get a recommendation for your corpus.</p>
  <div class="tabs" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="es" aria-pressed="false">Español</button>
  </div>
  <video id="player" controls preload="metadata" playsinline poster="media/poster-en.png">
    <source id="source" src="media/ragwiki-intro-en.mp4" type="video/mp4">
    Your browser cannot play this video. <a href="media/ragwiki-intro-en.mp4">Download it</a>.
  </video>
  <footer><a href="https://github.com/jdramirezzu/ragwiki">github.com/jdramirezzu/ragwiki</a> · MIT · generated by code in <code>docs/video</code></footer>
</main>
<script>
const TEXT = {
  en: ["Which kind of RAG fits your documents? See it in two minutes.", "Build vector search or a WikiLLM from your own documents, compare both with your own model and key, and rank five kinds of RAG on your questions for free."],
  es: ["¿Búsqueda vectorial o WikiLLM? Míralo en 90 segundos.", "Construye cualquiera de las dos con tus documentos, pregunta con ella, o compáralas con el mismo modelo y recibe una recomendación para tu corpus."],
};
const player = document.getElementById("player");
function show(lang) {
  if (!TEXT[lang]) lang = "en";
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = TEXT[lang][0];
  document.getElementById("lead").textContent = TEXT[lang][1];
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  player.poster = `media/poster-${lang}.png`;
  document.getElementById("source").src = `media/ragwiki-intro-${lang}.mp4`;
  player.load();
  try { history.replaceState(null, "", `#${lang}`); } catch {}
}
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => show(b.dataset.lang));
show(location.hash.slice(1) || (navigator.language || "").slice(0, 2));
</script>
</body>
</html>
