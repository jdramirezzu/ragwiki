[project]
name = "wikinotes"
version = "0.1.0"
description = "Turn your study material into an interlinked, LLM-maintained Markdown wiki."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["notes", "wiki", "llm", "knowledge-base", "education", "obsidian"]
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "openai>=1.40",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
wikinotes = "wikinotes.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
