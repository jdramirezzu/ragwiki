<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragwiki lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a2b'/%3E%3Crect x='8' y='9' width='7' height='14' rx='1.5' fill='%238b85ff'/%3E%3Crect x='17' y='9' width='7' height='14' rx='1.5' fill='%23fb8a52'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><i class="w"></i><i class="r"></i></span>
    <span>ragwiki <b>lab</b></span>
  </div>
  <div class="status">
    <div class="seg lang" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="chip" id="vaultChip" type="button" data-i18n-title="changeFolder"></button>
    <button class="chip" id="modelChip" type="button" data-i18n-title="modelSettings"></button>
    <span class="chip quiet" id="spendChip" hidden></span>
  </div>
</header>

<main>
  <!-- first run: choose a folder -->
  <section id="welcome" class="welcome" hidden>
    <p class="eyebrow" data-i18n="welcomeEyebrow"></p>
    <h1 data-i18n="welcomeTitle"></h1>
    <p class="lede" data-i18n="welcomeLede"></p>
    <form id="vaultForm" class="vaultform">
      <label for="folder" data-i18n="folderLabel"></label>
      <div class="row">
        <input id="folder" name="folder" required autocomplete="off" spellcheck="false">
        <button class="btn primary" type="submit" data-i18n="openOrCreate"></button>
      </div>
      <p class="hint" data-i18n="folderHint"></p>
    </form>
  </section>

  <section id="workspace" hidden>
    <nav class="steps" role="tablist" aria-label="Steps">
      <button role="tab" aria-controls="sources" aria-selected="true"><span>1</span><b data-i18n="tabFiles"></b> <em id="countSources"></em></button>
      <button role="tab" aria-controls="build" aria-selected="false"><span>2</span><b data-i18n="tabBuild"></b></button>
      <button role="tab" aria-controls="ask" aria-selected="false"><span>3</span><b data-i18n="tabAsk"></b></button>
      <button role="tab" aria-controls="results" aria-selected="false"><span>4</span><b data-i18n="tabResults"></b></button>
    </nav>

    <!-- 1 · files -->
    <div role="tabpanel" id="sources" class="panel">
      <div class="grid2">
        <div>
          <h2 data-i18n="addFiles"></h2>
          <p class="sub" data-i18n="addFilesSub"></p>
          <label class="drop" id="drop" tabindex="0">
            <input type="file" id="fileInput" multiple hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 31V11m0 0-7 7m7-7 7 7M10 30v6a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <strong data-i18n="drop"></strong>
            <span data-i18n="orClick"></span>
            <span class="types" id="types"></span>
          </label>
          <div id="addLog" class="log" hidden aria-live="polite"></div>
        </div>
        <div>
          <h2 data-i18n="yourFiles"></h2>
          <p class="sub" id="vaultPath"></p>
          <ul class="sources" id="sourceList"></ul>
          <button class="btn primary next" type="button" data-goto="build" id="toBuild" hidden data-i18n="nextBuild"></button>
        </div>
      </div>
    </div>

    <!-- 2 · build -->
    <div role="tabpanel" id="build" class="panel" hidden>
      <h2 data-i18n="buildTitle"></h2>
      <p class="sub" data-i18n="buildSub"></p>

      <div class="builders">
        <article class="builder rag">
          <header>
            <span class="tag" data-i18n="ragTag"></span>
            <h3 data-i18n="ragHead"></h3>
          </header>
          <ol class="flow">
            <li data-i18n="flowParagraphs"></li><li data-i18n="flowVectors"></li><li data-i18n="flowClosest"></li><li data-i18n="flowCall"></li>
          </ol>
          <div class="field">
            <label for="retrieval" data-i18n="searchWith"></label>
            <select id="retrieval">
              <option value="local" data-i18n="optLocal"></option>
              <option value="provider" data-i18n="optProvider"></option>
              <option value="bm25" data-i18n="optBm25"></option>
            </select>
            <input id="embeddingModel" autocomplete="off" spellcheck="false" aria-label="Embedding model">
            <small id="retrievalNote" class="hint"></small>
          </div>
          <div class="progress"><i id="ragBar"></i></div>
          <p class="status-line" id="ragStatus"></p>
          <dl class="costs">
            <div><dt data-i18n="building"></dt><dd id="ragBuildCost"></dd></div>
            <div><dt data-i18n="eachQuestion"></dt><dd data-i18n="ragEach"></dd></div>
          </dl>
          <button class="btn primary" type="button" id="buildIndex"></button>
          <div id="indexLog" class="log" hidden aria-live="polite"></div>
        </article>

        <article class="builder wiki">
          <header>
            <span class="tag">WikiLLM</span>
            <h3 data-i18n="wikiHead"></h3>
          </header>
          <ol class="flow">
            <li data-i18n="flowParagraphs"></li><li data-i18n="flowPlans"></li><li data-i18n="flowWrites"></li><li data-i18n="flowReads"></li>
          </ol>
          <div class="progress"><i id="wikiBar"></i></div>
          <p class="status-line" id="wikiStatus"></p>
          <dl class="costs">
            <div><dt data-i18n="building"></dt><dd id="wikiBuildCost"></dd></div>
            <div><dt data-i18n="eachQuestion"></dt><dd data-i18n="wikiEach"></dd></div>
          </dl>
          <button class="btn primary" type="button" id="buildWiki"></button>
          <div id="wikiLog" class="log" hidden aria-live="polite"></div>
        </article>
      </div>

      <h2 class="mt" data-i18n="differTitle"></h2>
      <p class="sub" data-i18n="differSub"></p>
      <div class="tablewrap">
        <table class="diff">
          <thead><tr><th></th><th class="rag-t" data-i18n="diffRag"></th><th class="wiki-t">WikiLLM</th></tr></thead>
          <tbody>
            <tr><th data-i18n="d1"></th><td data-i18n="d1r"></td><td data-i18n="d1w"></td></tr>
            <tr><th data-i18n="d2"></th><td data-i18n="d2r"></td><td data-i18n="d2w"></td></tr>
            <tr><th data-i18n="d3"></th><td><b>1×</b></td><td data-i18n="d3w"></td></tr>
            <tr><th data-i18n="d4"></th><td class="dec">0.48</td><td class="dec"><b>0.70</b></td></tr>
            <tr><th data-i18n="d5"></th><td class="dec">0.64</td><td data-i18n="d5w"></td></tr>
            <tr><th data-i18n="d6"></th><td data-i18n="d6r"></td><td data-i18n="d6w"></td></tr>
            <tr><th data-i18n="d7"></th><td data-i18n="d7r"></td><td data-i18n="d7w"></td></tr>
            <tr><th data-i18n="d8"></th><td data-i18n="d8r"></td><td data-i18n="d8w"></td></tr>
            <tr><th data-i18n="d9"></th><td data-i18n="d9r"></td><td data-i18n="d9w"></td></tr>
          </tbody>
        </table>
      </div>
      <div class="choose">
        <div class="choose-card rag"><h3 data-i18n="chooseRag"></h3><ul>
          <li data-i18n="chooseRag1"></li><li data-i18n="chooseRag2"></li><li data-i18n="chooseRag3"></li><li data-i18n="chooseRag4"></li></ul></div>
        <div class="choose-card wiki"><h3 data-i18n="chooseWiki"></h3><ul>
          <li data-i18n="chooseWiki1"></li><li data-i18n="chooseWiki2"></li><li data-i18n="chooseWiki3"></li><li data-i18n="chooseWiki4"></li></ul></div>
        <div class="choose-card both"><h3 data-i18n="notSure"></h3><p data-i18n="notSureText"></p></div>
      </div>
    </div>

    <!-- 3 · ask -->
    <div role="tabpanel" id="ask" class="panel" hidden>
      <div class="composer">
        <div class="composer-head">
          <div>
            <h2 data-i18n="askTitle"></h2>
            <div class="seg mode" role="radiogroup">
              <button type="button" role="radio" data-mode="both" aria-checked="true" data-i18n="modeBoth"></button>
              <button type="button" role="radio" data-mode="rag" aria-checked="false" data-i18n="modeRag"></button>
              <button type="button" role="radio" data-mode="wiki" aria-checked="false" data-i18n="modeWiki"></button>
            </div>
            <p class="sub" id="modeNote"></p>
          </div>
          <div class="kbox" id="kbox">
            <label for="k" id="kLabel"></label>
            <input type="range" id="k" min="1" max="30" value="8">
          </div>
        </div>
        <div id="questions" class="questions"></div>
        <div class="composer-foot">
          <button class="btn ghost" id="addQuestion" type="button" data-i18n="addQuestion"></button>
          <button class="btn ghost" id="pasteQuestions" type="button" data-i18n="pasteSeveral"></button>
          <span class="spacer"></span>
          <span class="hint" id="askHint"></span>
          <button class="btn primary" id="askButton" type="button"></button>
        </div>
        <div id="askLog" class="log" hidden aria-live="polite"></div>
      </div>
      <div id="answers" class="comparisons"></div>
    </div>

    <!-- 4 · results -->
    <div role="tabpanel" id="results" class="panel" hidden>
      <div id="advice" class="advice"></div>
      <div id="arms" class="arms"></div>
      <div class="tablehead">
        <h2 data-i18n="everyComparison"></h2>
        <div class="row">
          <a class="btn ghost" href="/api/export.csv" download data-i18n="downloadCsv"></a>
          <a class="btn ghost" href="/api/export.jsonl" download data-i18n="downloadJsonl"></a>
        </div>
      </div>
      <div class="tablewrap"><table id="table"></table></div>
      <details class="readme">
        <summary data-i18n="readTitle"></summary>
        <ul><li data-i18n="read1"></li><li data-i18n="read2"></li><li data-i18n="read3"></li></ul>
      </details>
    </div>
  </section>
</main>

<!-- source beside claim -->
<aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div><p class="eyebrow" id="drawerKicker" data-i18n="citedParagraph"></p><h3 id="drawerTitle"></h3></div>
    <button class="icon" id="drawerClose" type="button" data-i18n-label="close">×</button>
  </div>
  <blockquote id="drawerText"></blockquote>
</aside>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2 data-i18n="settingsTitle"></h2>
    <p class="sub" data-i18n="settingsSub"></p>
    <div class="fields">
      <label><span data-i18n="fModel"></span><input name="model" placeholder="deepseek-chat, gpt-4o-mini, llama3.1…" autocomplete="off"></label>
      <label><span data-i18n="fBase"></span><input name="base_url" placeholder="https://api.provider.com/v1 · http://localhost:11434/v1" autocomplete="off"></label>
      <label><span data-i18n="fKey"></span><input name="api_key" type="password" data-i18n-ph="fKeyPh" autocomplete="off"><small id="keyNote"></small></label>
      <label><span><span data-i18n="fIn"></span> <small data-i18n="fPerM"></small></span><input name="price_input" type="number" min="0" step="any"></label>
      <label><span><span data-i18n="fOut"></span> <small data-i18n="fPerM"></small></span><input name="price_output" type="number" min="0" step="any"></label>
      <label><span><span data-i18n="fCap"></span> <small data-i18n="fCapNote"></small></span><input name="max_usd" type="number" min="0" step="any"></label>
      <label><span><span data-i18n="fCtx"></span> <small data-i18n="fTokens"></small></span><input name="context_tokens" type="number" min="1000" step="1000"></label>
    </div>
    <div class="dialog-foot">
      <button class="btn ghost" value="cancel" formnovalidate data-i18n="cancel"></button>
      <button class="btn primary" value="save" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
